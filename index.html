<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AGUS MUSIC — Aprende de vos</title>
<style>body{margin:0;font-family:Arial;background:#0a0012;color:#fff;padding:20px}button{padding:12px 16px;border:none;border-radius:14px;font-weight:800;cursor:pointer;background:linear-gradient(90deg,#ff0090,#a100ff);color:white;margin:4px}input{width:100%;padding:12px;border-radius:12px;background:#ffffff10;color:white;border:1px solid #ffffff22;margin:6px 0}.card{background:#ffffff08;border:1px solid #ffffff22;border-radius:18px;padding:14px;margin:10px 0}.like{font-size:28px;cursor:pointer}</style></head>
<body>
<h1>🎵 AGUS MUSIC</h1>
<p>Conectá tu YouTube y la app aprende de vos.</p>
<button onclick="conectarYT()">Conectar YouTube ↗</button>
<button onclick="conectarSpotify()" style="background:#fff;color:#000">Conectar Spotify ↗</button>
<p id="user">Sin conectar</p>
<h3>¿Qué escuchaste hoy?</h3>
<input id="cancion" placeholder="Pegá un link de YouTube o escribí artista - canción">
<button onclick="agregarCancion()">＋ Agregar</button>
<div id="feed"></div>
<h3>Tu gusto según la app:</h3>
<p id="perfil">Todavía no aprendió. Dale ❤️ o 👎 a 5 canciones y te lo define.</p>
<div id="playlist"></div>
<script>
let gustos={likes:[],dislikes:[]};
let canciones=[
  {titulo:'Tyler The Creator — See You Again', genero:'Hip Hop', energia:70},
  {titulo:'Phonk — Drift', genero:'Phonk', energia:90},
  {titulo:'Indie — Playlist FADU', genero:'Indie', energia:50},
  {titulo:'Pop — Hits', genero:'Pop', energia:60},
];
function conectarYT(){
  // Cualquiera que entre puede conectar su YouTube
  // Poné tu Client ID de Google Cloud acá para que ande de verdad:
  let clientId='TU_CLIENT_ID_GOOGLE';
  let url=`https://accounts.google.com/o/oauth2/v2/auth?client_id=${clientId}&redirect_uri=${encodeURIComponent(location.href)}&response_type=token&scope=https://www.googleapis.com/auth/youtube.readonly`;
  window.open(url,'_blank');
  document.getElementById('user').innerText='Conectando tu YouTube... Cuando aceptes, la app va a ver tus liked videos y aprender.';
  alert('Para que ande de verdad, creá un proyecto en console.cloud.google.com > YouTube Data API > copiá tu Client ID y pegalo donde dice TU_CLIENT_ID_GOOGLE');
}
function conectarSpotify(){
  let clientId='TU_CLIENT_ID_SPOTIFY';
  let url=`https://accounts.spotify.com/authorize?client_id=${clientId}&response_type=token&redirect_uri=${encodeURIComponent(location.href)}&scope=user-library-read user-top-read`;
  window.open(url,'_blank');
  document.getElementById('user').innerText='Conectando tu Spotify...';
}
function agregarCancion(){
  let v=document.getElementById('cancion').value;
  if(!v) return;
  canciones.push({titulo:v, genero:'Tu gusto', energia:70});
  render();
  document.getElementById('cancion').value='';
}
function like(i,ok){
  let c=canciones[i];
  if(ok) gustos.likes.push(c.genero); else gustos.dislikes.push(c.genero);
  aprender();
}
function aprender(){
  let perfil='La app aprendió: ';
  let conteo={};
  gustos.likes.forEach(g=>conteo[g]=(conteo[g]||0)+1);
  let top=Object.keys(conteo).sort((a,b)=>conteo[b]-conteo[a])[0]||'';
  if(top) perfil+=`Te gusta mucho ${top}. Te recomienda más ${top} y menos ${gustos.dislikes.join(', ')||'nada'}.`;
  else perfil='Dale ❤️ o 👎 a 5 canciones y te lo define.';
  document.getElementById('perfil').innerText=perfil;
  // Arma playlist según lo aprendido
  let rec=canciones.filter(c=>!gustos.dislikes.includes(c.genero));
  document.getElementById('playlist').innerHTML=`<div class="card"><b>Playlist para vos — según tu algoritmo</b><p>${rec.map(c=>`🎧 ${c.titulo}`).join('<br>')}</p><button onclick="window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(top||'music'),'_blank')">Abrir en YouTube ↗</button></div>`;
}
function render(){
  document.getElementById('feed').innerHTML=canciones.map((c,i)=>`<div class="card"><b>${c.titulo}</b><p>${c.genero} • Energía ${c.energia}</p><span class="like" onclick="like(${i},true)">❤️</span> <span class="like" onclick="like(${i},false)">👎</span> <button onclick="window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(c.titulo),'_blank')">▶ YouTube</button></div>`).join('');
}
render();
</script>
</body></html>
